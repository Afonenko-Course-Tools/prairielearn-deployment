location = /exam/teacher/readiness {
    if ($request_method != GET) { return 405; }
    satisfy all;
    allow 10.0.0.0/8;
    deny all;
    auth_basic "Exam teacher";
    auth_basic_user_file teacher.htpasswd;
    include teacher-proxy-token.conf;
    proxy_set_header Authorization "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_pass http://127.0.0.1:21651;
}
