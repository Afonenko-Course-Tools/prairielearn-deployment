# ПРИМЕР: TEST-NET и .invalid намеренно не являются реальными назначениями.
# Здесь согласуются все четыре независимые проверки каждой пары. Не объединять
# Host/SNI одного приложения с dst другого. Только HTTPS 443, без wildcard.
acl pl_ip dst 198.51.100.10/32
acl pl_name dstdomain -n 198.51.100.10
acl connect_pl url_regex ^198[.]51[.]100[.]10:443$
acl host_pl req_header Host ^198[.]51[.]100[.]10(:443)?$
acl client_pl ssl::server_name --client-requested 198.51.100.10

acl moodle_ip dst 198.51.100.20/32
acl moodle_name dstdomain -n moodle.example.invalid
acl connect_moodle url_regex -i ^moodle[.]example[.]invalid:443$
acl host_moodle req_header Host -i ^moodle[.]example[.]invalid(:443)?$
acl client_moodle ssl::server_name --client-requested moodle.example.invalid
