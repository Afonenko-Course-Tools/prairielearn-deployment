# Необязательный IP transport. Полный обычный конфиг остаётся отдельным
# operator-owned файлом в уже существующем EXAM_POLICY_DIR.
# Deny расположен первым: прежние follow_x_forwarded_for allow не должны
# превращать клиентский X-Forwarded-For в доверенную идентичность.
follow_x_forwarded_for deny all
include /etc/squid/exam-policy/squid-base.conf
# Scalar после base намеренно заменяет его forwarded_for delete.
forwarded_for truncate
