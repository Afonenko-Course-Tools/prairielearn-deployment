# Явное дополнение тестовой Moodle fixture с compose.auth.yml.
name: ${EXAM_PROJECT_NAME:?Задайте отдельный проект экзаменационной fixture}

services:
  proxy:
    command: [nginx, -c, /etc/nginx/exam/nginx.conf, -g, "daemon off;"]
    ports: !reset []
    volumes:
      - type: bind
        source: ${EXAM_NGINX_CONF_DIR:?Нужен каталог nginx.conf и ingress.conf экзаменационной fixture}
        target: /etc/nginx/exam
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${GATEWAY_CONFIG_DIR:?Нужен каталог конфигурации экзаменационного Gateway}/exam-proxy-token.conf
        target: /etc/nginx/private/exam-proxy-token.conf
        read_only: true
        bind: { create_host_path: false }
    networks:
      exam-ingress:
        ipv4_address: ${EXAM_FIXTURE_NGINX_IP:-172.16.251.2}

  exam-proxy:
    extends:
      file: ./deploy/exam-compose.yml
      service: exam-proxy
    network_mode: !reset null
    ports:
      - "${EXAM_FIXTURE_PUBLISH_IP:-127.0.0.1}:${EXAM_PROXY_PUBLISH_PORT:-20580}:20580"
    networks:
      exam-ingress:
        ipv4_address: ${EXAM_FIXTURE_SQUID_IP:-172.16.251.3}

networks:
  exam-ingress:
    ipam:
      config:
        - subnet: ${EXAM_INGRESS_SUBNET:-172.16.251.0/29}
          gateway: ${EXAM_FIXTURE_GATEWAY:-172.16.251.1}
