services:
  wazuh.manager:
    ports: !override
      - "${WAZUH_AGENT_BIND_IP:?Укажите IPv4 изолированного сегмента}:1514:1514/tcp"
    volumes:
      - "${WAZUH_PROBE_DIR:?Укажите абсолютный путь к deploy/wazuh}/local_rules.xml:/wazuh-config-mount/etc/rules/exam_lab_probe.xml:ro"
      - "${WAZUH_PROBE_STATE:?Укажите абсолютный путь к закрытому каталогу состояния}/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro"
  wazuh.indexer:
    ports: !reset []
  wazuh.dashboard:
    ports: !override
      - "127.0.0.1:15601:5601/tcp"
