# Безопасный local-only пример. Для аудитории оператор задаёт собственные
# listener и source ACL после проверки firewall; profile сам их не настраивает.
visible_hostname exam-proxy
http_port 127.0.0.1:18080 ssl-bump tls-cert=/run/exam-tls/issuer.crt tls-key=/run/exam-tls/issuer.key generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
icp_port 0
htcp_port 0
snmp_port 0
pinger_enable off

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/exam-squid/spool/ssl_db -M 4MB
sslcrtd_children 2 startup=1 idle=1
tls_outgoing_options cafile=/run/exam-tls/upstream-ca.pem default-ca=off min-version=1.2
sslproxy_cert_error deny all
host_verify_strict on

# Один operator-owned policy directory: native ACL и native address resolution.
hosts_file /etc/squid/exam-policy/hosts
include /etc/squid/exam-policy/destinations.conf

acl exam_clients src 127.0.0.1/32
acl tls_port port 443
acl encrypted connections_encrypted
acl https_scheme proto HTTPS
acl bump1 at_step SslBump1
acl bump2 at_step SslBump2
acl has_upgrade req_header Upgrade .+
acl wants_upgrade req_header Connection -i (^|[[:space:],])upgrade([[:space:],]|$)

ssl_bump peek bump1
ssl_bump bump bump2 connect_pl client_pl
ssl_bump bump bump2 connect_moodle client_moodle
ssl_bump terminate all

http_access deny !exam_clients
http_access deny manager
http_access deny !tls_port
http_access deny has_upgrade
http_access deny wants_upgrade
http_access allow CONNECT !encrypted connect_pl host_pl pl_ip
http_access allow CONNECT !encrypted connect_moodle host_moodle moodle_ip
http_access deny CONNECT
http_access allow encrypted https_scheme pl_name host_pl client_pl pl_ip
http_access allow encrypted https_scheme moodle_name host_moodle client_moodle moodle_ip
http_access deny all

cache deny all
cache_store_log none
# Без URL/query, headers, Authorization, Cookie и body. State остаётся закрытым.
logformat exam %ts.%03tu %Ss/%03>Hs %rm %Sh/%<a
access_log stdio:/var/lib/exam-squid/log/access.log exam
cache_log /var/lib/exam-squid/log/cache.log
logfile_rotate 0
pid_filename /var/lib/exam-squid/run/squid.pid
shutdown_lifetime 1 seconds
forwarded_for delete
