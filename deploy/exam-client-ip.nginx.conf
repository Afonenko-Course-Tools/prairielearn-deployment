# Необязательный include внутри http {}. Замените TEST-NET адрес во всех трёх
# местах одним фактическим TCP peer Squid, видимым Nginx после NAT.
# 10.0.0.0/8 — разрешённая клиентская сеть, НЕ список доверенных прокси.
set_real_ip_from 192.0.2.10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Если trusted peer не заменился на разобранный адрес клиента, отправляем
# unknown вместо адреса самого Squid. Внутренний header доверяется только
# точному peer; его единственное значение обеспечивает Squid truncate.
map "$realip_remote_addr|$remote_addr" $exam_verified_client_ip {
    default $remote_addr;
    "192.0.2.10|192.0.2.10" "";
}
